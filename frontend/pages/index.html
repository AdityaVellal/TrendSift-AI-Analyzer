<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>TrendSift — AI Viral Content Analyzer</title>
    <meta name="description" content="Analyze trending content with AI. Search, scrape, and extract viral content insights using a local LLM.">
    <meta name="robots" content="index, follow">
    
    <!-- Favicon (emoji as favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
    
    <!-- Google Fonts: Inter & Source Code Pro (Monospace) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Code+Pro:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Styles - Fixed path to index.css -->
    <link rel="stylesheet" href="/styles/index.css">
</head>
<body>
    <!-- ═══ Header (Stripe Style) ═══════════════════════════ -->
    <header class="header">
        <div class="app-container">
            <nav class="nav-container">
                <a href="/" class="logo">
                    <div class="logo-icon"></div>
                    TrendSift
                </a>
                <div id="ollamaStatus" class="ollama-status checking">
                    <span id="ollamaStatusText">Checking Ollama...</span>
                </div>
            </nav>
        </div>
    </header>

    <main class="app-container">
        <!-- ═══ Hero Section ═══════════════════════════════════ -->
        <section class="hero">
            <h1 class="hero-title">Devour the internet's <br>best content.</h1>
            <p class="hero-subtitle">
                Analyze viral content with AI. Discover the hooks, structures, 
                and psychology that drive engagement.
            </p>

            <div class="search-section">
                <form id="searchForm" class="search-group">
                    <input 
                        type="text" 
                        id="keywordInput" 
                        class="search-input" 
                        placeholder="What should we analyze today?"
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="searchBtn" class="btn-primary">
                        Analyze
                    </button>
                </form>
                
                <!-- Status Bar -->
                <div id="statusBar" class="status-bar">
                    <span id="statusText">Ready to sift...</span>
                    <span id="statusProgress" class="badge">0%</span>
                </div>

                <!-- Trending Topics Section -->
                <div class="trending-now">
                    <span class="trending-now__label">Trending Now:</span>
                    <div id="trendingTopics" class="trending-now__list">
                        <span class="trending-tag skeleton">Loading trends...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ═══ Results Container ════════════════════════════ -->
        <div id="resultsContainer" class="results-container"></div>

        <!-- ═══ Empty State ═════════════════════════════════ -->
        <div id="emptyState" class="empty-state">
            <p class="empty-state__text">Waiting for your first keyword...</p>
        </div>
    </main>

    <!-- Components -->
    <script src="/components/ResultCard.js?v=2"></script>
    <!-- Main API utility -->
    <script src="/utils/api.js?v=2"></script>
</body>
</html>
